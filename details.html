<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details - Golden Pantry</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id = "navbar">             
        <nav>RECIPES</nav>             
        <a href="about.html">ABOUT</a>             
        <a href="index.html">HOME</a>     
    </header>  

    <main>
        <h1 class="page-title">Recipe List</h1> 
            <div class="recipe-detail" id="carbonara">     
                <div class="hero">         
                    <div class="hero-img">IMG</div>         
                    <div class="hero-info">             
                        <h1>Spaghetti Carbonara</h1>             
                        <p>A rich Roman classic made with eggs, Pecorino Romano, crispy guanciale, and cracked black pepper. Creamy without a drop of cream &mdash; it's all technique.</p>             
                        <div class="meta-badges">                 
                            <span class="badge">30 min</span><span class="badge">Serves 4</span>                 
                            <span class="badge">Italian</span><span class="badge">Medium</span>             
                        </div>         
                    </div>     
                </div>      
                <div class="section-title">Ingredients</div>     
                <div class="checklist">         
                    <input type="checkbox" id="c-i1"><label for="c-i1">400g spaghetti</label>         
                    <input type="checkbox" id="c-i2"><label for="c-i2">150g guanciale</label>         
                    <input type="checkbox" id="c-i3"><label for="c-i3">4 egg yolks</label>         
                    <input type="checkbox" id="c-i4"><label for="c-i4">1 whole egg</label>         
                    <input type="checkbox" id="c-i5"><label for="c-i5">80g Pecorino Romano</label>         
                    <input type="checkbox" id="c-i6"><label for="c-i6">80g Parmesan</label>         
                    <input type="checkbox" id="c-i7"><label for="c-i7">Black pepper</label>         
                    <input type="checkbox" id="c-i8"><label for="c-i8">Salt</label>     
                </div>      
            </div>
    </main>



</body>
</html>
